[project]
name = "calle-receiver"
version = "0.1.0"
description = "Twilio inbound receiver that bridges CALL-E calls to an Argentine phone, with recording and live transcription."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "twilio>=9.0",
  "pydantic-settings>=2.0",
  "sqlmodel>=0.0.21",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
